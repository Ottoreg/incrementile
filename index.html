<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17110E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Incrementile — l'atelier du céramiste</title>
<style>
  :root{
    --bg:#E7DACB; --bg2:#F0E7DA; --surface:#FBF5EC; --surface-2:#F3E9DB;
    --line:#D8C6B2; --text:#2A1D14; --dim:#6B5545;
    --clay:#B85C30; --glaze:#1E8A7E; --kiln:#B7791A; --money:#2f8f5b; --bad:#C0492B;
    --shadow:0 1px 2px rgba(60,35,15,.10), 0 8px 24px rgba(60,35,15,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17110E; --bg2:#1E1712; --surface:#241A15; --surface-2:#2C211A;
      --line:#3A2C22; --text:#F3E7DC; --dim:#B39A87;
      --clay:#D07A45; --glaze:#35B3A5; --kiln:#F0A63C; --money:#5ec98a; --bad:#E4795C;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"]{
    --bg:#E7DACB; --bg2:#F0E7DA; --surface:#FBF5EC; --surface-2:#F3E9DB;
    --line:#D8C6B2; --text:#2A1D14; --dim:#6B5545;
    --clay:#B85C30; --glaze:#1E8A7E; --kiln:#B7791A; --money:#2f8f5b; --bad:#C0492B;
    --shadow:0 1px 2px rgba(60,35,15,.10), 0 8px 24px rgba(60,35,15,.08);
  }
  :root[data-theme="dark"]{
    --bg:#17110E; --bg2:#1E1712; --surface:#241A15; --surface-2:#2C211A;
    --line:#3A2C22; --text:#F3E7DC; --dim:#B39A87;
    --clay:#D07A45; --glaze:#35B3A5; --kiln:#F0A63C; --money:#5ec98a; --bad:#E4795C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 70% at 50% -10%, color-mix(in srgb,var(--kiln) 12%,transparent), transparent 55%), var(--bg);
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;
  }
  .app{max-width:540px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

  /* top resource bar */
  .topbar{
    position:sticky;top:0;z-index:10;
    background:color-mix(in srgb,var(--bg) 86%, transparent);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:max(10px,env(safe-area-inset-top)) 14px 10px;
    display:flex;align-items:center;gap:10px;
  }
  .brand{font-family:Georgia,"Iowan Old Style",serif;font-weight:700;font-size:15px;letter-spacing:.02em;margin-right:auto}
  .stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;min-width:64px}
  .stat .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
  .stat .l{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:3px}
  .stat.money .v{color:var(--money)}
  .stat.clay .v{color:var(--clay)}
  .mini-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--dim);font-size:15px;display:grid;place-items:center;cursor:pointer}
  .mini-btn:active{transform:scale(.93)}

  /* panels */
  main{flex:1;padding:16px 14px calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
  .panel{display:none;flex-direction:column;gap:14px}
  .panel.active{display:flex}
  .sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px -2px}
  .sec-title h2{font-family:Georgia,"Iowan Old Style",serif;font-size:15px;margin:0;font-weight:700}
  .sec-title small{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:13px}

  .swatch{width:42px;height:42px;border-radius:11px;flex:0 0 auto;position:relative;box-shadow:inset 0 -5px 10px rgba(0,0,0,.28),inset 0 4px 8px rgba(255,255,255,.26)}
  .swatch::before{content:"";position:absolute;inset:5px 7px auto 7px;height:34%;border-radius:5px;background:linear-gradient(rgba(255,255,255,.4),transparent)}

  /* buttons */
  .btn{border:none;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;background:var(--kiln);white-space:nowrap}
  .btn:active{transform:scale(.96)}
  .btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .btn.money{background:var(--money)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}

  /* recipe row */
  .recipe{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center}
  .recipe + .recipe{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .recipe .name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .recipe .req{font-size:12px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
  .badge{font-size:10.5px;font-weight:800;color:var(--dim);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .badge.stock{color:var(--glaze)}

  /* craft progress */
  .craft{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center}
  .craft + .craft{margin-top:10px}
  .bar{height:8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:7px}
  .fill{height:100%;background:linear-gradient(90deg,var(--clay),var(--kiln));border-radius:6px;transition:width .12s linear}
  .craft .cname{font-weight:700;font-size:14px}
  .craft .ctime{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .slot-empty{color:var(--dim);font-size:13px;text-align:center;padding:6px 0}

  /* orders */
  .order .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .order .client{font-weight:700;font-size:14.5px}
  .order .want{font-size:13px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:8px}
  .order .reward{font-weight:800;color:var(--money);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .order .actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}
  .order .miss{font-size:12px;color:var(--bad)}
  .mini-swatch{width:16px;height:16px;border-radius:4px;display:inline-block;vertical-align:middle}

  /* methods */
  .method{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
  .method .name{font-weight:700;font-size:14.5px}
  .method .desc{font-size:12.5px;color:var(--dim);margin-top:3px}
  .method.learned{opacity:.72}
  .method .done{color:var(--money);font-weight:800;font-size:13px;white-space:nowrap}
  .tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:7px;vertical-align:middle}
  .tag.recipe{color:var(--glaze);background:color-mix(in srgb,var(--glaze) 16%,transparent)}
  .tag.upg{color:var(--kiln);background:color-mix(in srgb,var(--kiln) 16%,transparent)}

  /* bottom tabbar */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    max-width:540px;margin:0 auto;
    background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(3,1fr);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{background:none;border:none;color:var(--dim);font-family:inherit;font-size:11px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 0;border-radius:10px}
  .tab .ic{font-size:19px;line-height:1}
  .tab.active{color:var(--kiln)}
  .tab .dot{position:absolute;transform:translate(14px,-4px);width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
  .tab.has-orders .dot{display:block}

  .toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
    background:var(--surface);border:1px solid var(--line);color:var(--text);padding:10px 15px;border-radius:12px;
    box-shadow:var(--shadow);font-size:13px;opacity:0;transition:opacity .3s,transform .3s;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:var(--money)}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:22px 8px}

  /* clay-modelling mini-game */
  .mini-overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;
    background:color-mix(in srgb,#000 55%, transparent);backdrop-filter:blur(4px)}
  .mini-overlay.show{display:flex}
  .mini-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    padding:16px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
  .mini-head{display:flex;align-items:center;justify-content:space-between}
  .mini-head span{font-family:Georgia,"Iowan Old Style",serif;font-weight:700;font-size:16px}
  .mini-x{background:var(--surface-2);border:1px solid var(--line);color:var(--dim);width:32px;height:32px;border-radius:9px;font-size:14px;cursor:pointer}
  .mini-timer{height:8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
  .mini-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--kiln),var(--bad));transition:width .1s linear}
  .mini-pad{position:relative;width:100%;aspect-ratio:1;border-radius:16px;touch-action:none;overflow:hidden;
    -webkit-user-select:none;user-select:none;
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;
    background:radial-gradient(40% 34% at 38% 30%, color-mix(in srgb,#fff 42%, var(--tile,#c56a3c)) 0%, transparent 60%), var(--tile,#c56a3c);
    box-shadow:inset 0 -10px 22px rgba(0,0,0,.3), inset 0 8px 16px rgba(255,255,255,.22)}
  .lump{background-color:color-mix(in srgb,#2e2018 60%, transparent);
    background-image:radial-gradient(circle at 50% 40%, rgba(0,0,0,.32) 0%, transparent 62%),
                     radial-gradient(circle at 62% 66%, rgba(0,0,0,.24) 0%, transparent 58%);
    border:1px solid rgba(0,0,0,.18);transition:opacity .18s ease, transform .18s ease}
  .lump.smooth{opacity:0;transform:scale(.55);pointer-events:none}
  .mini-prog{text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--clay)}
  .mini-hint{font-size:12px;color:var(--dim);text-align:center;line-height:1.45}

  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition:none !important}}
</style>
</head>
<body>
<div class="app" id="root">
  <div class="topbar">
    <div class="brand">Incrementile</div>
    <div class="stat money"><div class="v" id="v-money">50 ₯</div><div class="l">Trésorerie</div></div>
    <div class="stat clay"><div class="v" id="v-clay">0</div><div class="l">Argile</div></div>
    <button class="mini-btn" data-action="theme" title="Thème">◑</button>
  </div>

  <main>
    <!-- ATELIER -->
    <section class="panel active" id="panel-atelier">
      <div class="sec-title"><h2>Matière première</h2><small id="clay-slots"></small></div>
      <div class="card" id="clay-card"></div>

      <div class="sec-title"><h2>Fabrication</h2><small id="craft-count"></small></div>
      <div class="card" id="craft-card"></div>

      <div class="sec-title"><h2>Recettes</h2><small>argile · cuisson</small></div>
      <div class="card" id="recipe-card"></div>

      <div class="sec-title" id="worker-title" hidden><h2>Ouvriers</h2><small>fabrication automatique</small></div>
      <div class="card" id="worker-card" hidden></div>
    </section>

    <!-- COMMANDES -->
    <section class="panel" id="panel-commandes">
      <div class="sec-title"><h2>Commandes clients</h2><small id="order-count"></small></div>
      <div id="orders-wrap" style="display:flex;flex-direction:column;gap:12px"></div>
    </section>

    <!-- MÉTHODES -->
    <section class="panel" id="panel-methodes">
      <div class="sec-title"><h2>Apprendre de nouvelles méthodes</h2></div>
      <div id="methods-wrap" style="display:flex;flex-direction:column;gap:12px"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-action="tab" data-tab="atelier"><span class="ic">🏺</span>Atelier</button>
    <button class="tab" data-action="tab" data-tab="commandes"><span class="ic" style="position:relative">📋<span class="dot"></span></span>Commandes</button>
    <button class="tab" data-action="tab" data-tab="methodes"><span class="ic">📖</span>Méthodes</button>
  </nav>
</div>

<div class="mini-overlay" id="mini">
  <div class="mini-card">
    <div class="mini-head"><span id="mini-title">Modelage</span><button class="mini-x" id="mini-cancel" aria-label="Annuler">✕</button></div>
    <div class="mini-timer"><div class="mini-fill" id="mini-fill"></div></div>
    <div class="mini-pad" id="mini-pad"></div>
    <div class="mini-prog" id="mini-prog">Lissé : 0 %</div>
    <div class="mini-hint">Passe ton doigt sur toute la surface pour lisser l'argile avant la cuisson.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const RECIPES = [
    {id:'plate',  name:'Tuile plate',           clay:2,  time:3,  value:6,   color:'#c56a3c', tech:null},
    {id:'canal',  name:'Tuile canal',           clay:4,  time:6,  value:16,  color:'#a3472a', tech:'cintrage'},
    {id:'vernis', name:'Carreau vernissé',      clay:7,  time:10, value:45,  color:'#2fa69a', tech:'emaillage'},
    {id:'zellige',name:'Zellige',               clay:12, time:16, value:130, color:'#2f6fb0', tech:'zellige'},
    {id:'or',     name:"Tuile émaillée d'or",   clay:20, time:24, value:380, color:'#e0a53c', tech:'dorure'},
  ];
  const R = id => RECIPES.find(r => r.id === id);

  const METHODS = [
    {id:'cintrage',   name:'Cintrage',              desc:"Débloque la Tuile canal",           cost:60,    kind:'recipe'},
    {id:'etabli2',    name:'Deuxième établi',       desc:"+1 fabrication simultanée",         cost:150,   kind:'upg'},
    {id:'fournisseur',name:"Fournisseur d'argile",  desc:"Argile 25 % moins chère",           cost:220,   kind:'upg'},
    {id:'apprentis',  name:'Recruter des apprentis',desc:"Embauche des ouvriers qui fabriquent tout seuls", cost:350, kind:'upg'},
    {id:'emaillage',  name:'Émaillage',             desc:"Débloque le Carreau vernissé",      cost:450,   kind:'recipe'},
    {id:'four',       name:'Four rapide',           desc:"Cuisson 25 % plus rapide",          cost:650,   kind:'upg'},
    {id:'carnet',     name:'Carnet de commandes',   desc:"+2 commandes en attente",           cost:1000,  kind:'upg'},
    {id:'etabli3',    name:'Troisième établi',      desc:"+1 fabrication simultanée",         cost:1600,  kind:'upg'},
    {id:'zellige',    name:'Taille du zellige',     desc:"Débloque le Zellige",               cost:3200,  kind:'recipe'},
    {id:'reputation', name:"Réputation d'artisan",  desc:"Commandes payées +25 %",            cost:5500,  kind:'upg'},
    {id:'dorure',     name:'Dorure à la feuille',   desc:"Débloque la Tuile émaillée d'or",   cost:17000, kind:'recipe'},
  ];

  const CLIENTS = ["Le Sénateur Flavius","Villa Pompéienne","Temple d'Apollon","Livia Drusilla","Quintus le Marchand",
    "Thermes d'Ostie","La Domus Aurea","Cornelia","Atelier du Forum","Marcus le Bâtisseur",
    "Théâtre d'Épidaure","Prêtresse Julia","Villa Adriana","Le Port de Pouzzoles"];

  const SAVE_KEY = 'incrementile.save.v2';
  const CLAY_BUNDLE = 10, CLAY_UNIT = 0.8;

  let state = {
    money:50, clay:0, learned:{}, inventory:{}, crafts:[], orders:[], orderSeq:1,
    workers:{}, workerProg:{}, nextOrderAt:0, lastSave:Date.now()
  };

  // ---------- derived modifiers ----------
  const has = id => !!state.learned[id];
  const craftSlots  = () => 1 + (has('etabli2')?1:0) + (has('etabli3')?1:0);
  const orderSlots  = () => 3 + (has('carnet')?2:0);
  const clayUnit    = () => CLAY_UNIT * (has('fournisseur')?0.75:1);
  const bundlePrice = () => Math.ceil(CLAY_BUNDLE * clayUnit());
  const speedMult   = () => (has('four')?0.75:1);
  const rewardMult  = () => (has('reputation')?1.25:1);
  const knowsRecipe = r => r.tech === null || has(r.tech);
  const knownRecipes = () => RECIPES.filter(knowsRecipe);
  const workersOn   = () => has('apprentis');
  const workerCost  = r => Math.floor(r.value * 8 * Math.pow(1.6, state.workers[r.id]||0));

  // ---------- format ----------
  const SUF = ['','K','M','Md','B','T'];
  function fmt(n){
    n = Math.floor(n);
    if(n < 1000) return n.toString();
    let t = Math.min(Math.floor(Math.log10(n)/3), SUF.length-1);
    const m = n/Math.pow(1000,t), d = m<10?2:m<100?1:0;
    return m.toFixed(d) + SUF[t];
  }
  const eur = n => fmt(n) + ' ₯';

  // ---------- persistence ----------
  function save(){ state.lastSave = Date.now(); try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(!s) return false;
      Object.assign(state, s);
      state.learned = s.learned||{}; state.inventory = s.inventory||{};
      state.crafts = s.crafts||[]; state.orders = s.orders||[];
      state.workers = s.workers||{}; state.workerProg = s.workerProg||{};
      return true;
    }catch(e){ return false; }
  }
  function catchUp(){
    // resolve crafts finished while away
    const now = Date.now();
    state.crafts = state.crafts.filter(c => {
      if(now >= c.end){ state.inventory[c.tileId] = (state.inventory[c.tileId]||0) + (c.yield||1); return false; }
      return true;
    });
    runWorkers(Math.min(now - state.lastSave, 8*3600*1000));
  }

  // ---------- orders ----------
  function makeOrder(){
    const pool = knownRecipes();
    const r = pool[Math.floor(Math.random()*pool.length)];
    const qty = 2 + Math.floor(Math.random()*5);
    const reward = Math.round(r.value * qty * (1.9 + Math.random()*0.7) * rewardMult());
    return { id:state.orderSeq++, tileId:r.id, qty, reward, client:CLIENTS[Math.floor(Math.random()*CLIENTS.length)] };
  }
  function seedOrders(){ for(let i=0;i<3;i++) state.orders.push(makeOrder()); }

  // ---------- actions ----------
  function buyClay(){
    const p = bundlePrice();
    if(state.money < p) return toast("Pas assez d'argent pour l'argile");
    state.money -= p; state.clay += CLAY_BUNDLE; save(); renderAll();
  }
  function startCraft(id){
    const r = R(id);
    if(!knowsRecipe(r)) return;
    if(state.crafts.length >= craftSlots()) return toast("Tous tes établis sont occupés");
    if(state.clay < r.clay) return toast("Pas assez d'argile");
    openMini(r, q => commitCraft(id, q));
  }
  function commitCraft(id, q){
    const r = R(id);
    if(state.clay < r.clay) return toast("Plus assez d'argile");
    state.clay -= r.clay;
    const now = Date.now();
    const timeMult = 1 - 0.5*q;                    // beau modelage = cuisson bien plus rapide
    const dur = r.time*1000*speedMult()*timeMult;
    const yieldN = q >= 1 ? 3 : q >= 0.7 ? 2 : 1;  // modelage parfait = 2 tuiles bonus
    state.crafts.push({ tileId:id, start:now, end:now+dur, yield:yieldN });
    if(q >= 1)        toast(`Chef-d'œuvre ! +2 tuiles bonus · cuisson éclair`);
    else if(q >= 0.7) toast(`Belle tuile (${Math.round(q*100)} %) · +1 tuile bonus · cuisson accélérée`);
    else              toast(`Tuile modelée (${Math.round(q*100)} %) · c'est parti pour la cuisson`);
    save(); renderAll();
  }

  // ---------- clay-modelling mini-game ----------
  let mini = null;
  function openMini(recipe, onDone){
    const pad = $('mini-pad'), N = 3, total = N*N;
    $('mini-title').textContent = 'Modelage — ' + recipe.name;
    pad.style.setProperty('--tile', recipe.color);
    pad.innerHTML = '';
    for(let i=0;i<total;i++){ const d=document.createElement('div'); d.className='lump'; pad.appendChild(d); }
    $('mini-prog').textContent = 'Lissé : 0 %';
    $('mini-fill').style.width = '100%';
    mini = { active:false, done:false, smoothed:0, total, onDone, start:performance.now(), dur:4500 };
    $('mini').classList.add('show');
    requestAnimationFrame(miniLoop);
  }
  function smoothAt(x, y){
    if(!mini || mini.done) return;
    const el = document.elementFromPoint(x, y);
    if(el && el.classList.contains('lump') && !el.classList.contains('smooth')){
      el.classList.add('smooth'); mini.smoothed++;
      $('mini-prog').textContent = 'Lissé : ' + Math.round(mini.smoothed/mini.total*100) + ' %';
      if(mini.smoothed >= mini.total) finishMini();
    }
  }
  function miniLoop(){
    if(!mini || mini.done) return;
    const el = performance.now() - mini.start;
    $('mini-fill').style.width = Math.max(0, (1 - el/mini.dur)*100) + '%';
    if(el >= mini.dur){ finishMini(); return; }
    requestAnimationFrame(miniLoop);
  }
  function finishMini(){
    if(!mini || mini.done) return;
    mini.done = true;
    const q = mini.smoothed / mini.total;
    const cb = mini.onDone; mini = null;
    $('mini').classList.remove('show');
    cb(q);
  }
  $('mini-cancel').addEventListener('click', () => {
    if(mini){ mini.done = true; mini = null; $('mini').classList.remove('show'); }
  });
  $('mini-pad').addEventListener('pointerdown', e => {
    if(!mini || mini.done) return;
    e.preventDefault(); mini.active = true; smoothAt(e.clientX, e.clientY);
  });
  document.addEventListener('pointermove', e => {
    if(mini && mini.active && !mini.done){ e.preventDefault(); smoothAt(e.clientX, e.clientY); }
  }, {passive:false});
  document.addEventListener('pointerup', () => { if(mini) mini.active = false; });

  // Fiabilité mobile : geler les reconstructions du DOM pendant tout le geste
  // (du pointerdown jusqu'au click synthétisé), sinon le bouton touché est
  // remplacé en plein tap et le click n'est jamais émis.
  document.addEventListener('pointerdown', () => { pointerDown = true; tapLock = true; clearTimeout(tapTimer); }, true);
  document.addEventListener('pointercancel', () => { pointerDown = false; tapLock = false; flushRender(); }, true);
  document.addEventListener('pointerup', () => {
    pointerDown = false;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapLock = false; flushRender(); }, 500); // secours si aucun click ne suit
  }, true);
  document.addEventListener('click', () => { tapLock = false; clearTimeout(tapTimer); setTimeout(flushRender, 0); }, true);
  function deliver(oid){
    const o = state.orders.find(x => x.id === oid); if(!o) return;
    if((state.inventory[o.tileId]||0) < o.qty) return;
    state.inventory[o.tileId] -= o.qty;
    state.money += o.reward;
    state.orders = state.orders.filter(x => x.id !== oid);
    state.nextOrderAt = Math.min(state.nextOrderAt, Date.now()+6000);
    toast(`Commande livrée à ${o.client} · <b>+${eur(o.reward)}</b>`);
    save(); renderAll();
  }
  function learn(id){
    const m = METHODS.find(x => x.id === id); if(!m || has(id)) return;
    if(state.money < m.cost) return toast("Pas encore les moyens d'apprendre ça");
    state.money -= m.cost; state.learned[id] = true;
    toast(`Nouvelle méthode : <b>${m.name}</b>`);
    save(); renderAll();
  }
  function hireWorker(id){
    if(!workersOn()) return;
    const r = R(id), cost = workerCost(r);
    if(state.money < cost) return toast("Pas assez pour embaucher");
    state.money -= cost; state.workers[id] = (state.workers[id]||0)+1;
    toast(`Ouvrier embauché · ${r.name}`);
    save(); renderAll();
  }
  // ouvriers : fabrication automatique, sans mini-jeu ni bonus
  function runWorkers(dtMs){
    if(!workersOn()) return false;
    let changed = false;
    knownRecipes().forEach(r => {
      const w = state.workers[r.id]||0; if(w <= 0) return;
      const threshold = r.time*1000*speedMult();
      let prog = (state.workerProg[r.id]||0) + dtMs*w, guard = 0;
      while(prog >= threshold && guard < 100000){
        if(state.clay < r.clay){ prog = threshold; break; }   // en attente d'argile
        state.clay -= r.clay;
        state.inventory[r.id] = (state.inventory[r.id]||0)+1;
        prog -= threshold; changed = true; guard++;
      }
      state.workerProg[r.id] = prog;
    });
    return changed;
  }

  // ---------- rendering ----------
  let activeTab = 'atelier';
  let pointerDown = false, tapLock = false, renderPending = false, tapTimer = 0;
  function flushRender(){ if(renderPending && !pointerDown && !tapLock){ renderPending = false; renderAll(); } }

  function renderTop(){
    $('v-money').textContent = eur(state.money);
    $('v-clay').textContent = fmt(state.clay);
  }

  function renderAtelier(){
    // clay
    $('clay-slots').textContent = `${clayUnit().toFixed(2)} ₯ / unité`;
    const p = bundlePrice();
    $('clay-card').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div>
          <div style="font-weight:700">Acheter de l'argile</div>
          <div style="font-size:12.5px;color:var(--dim);margin-top:3px">Lot de ${CLAY_BUNDLE} unités</div>
        </div>
        <button class="btn money" data-action="buy-clay" ${state.money<p?'disabled':''}>+${CLAY_BUNDLE} · ${eur(p)}</button>
      </div>`;

    // crafts
    $('craft-count').textContent = `${state.crafts.length} / ${craftSlots()} établis`;
    const now = Date.now();
    if(state.crafts.length === 0){
      $('craft-card').innerHTML = `<div class="slot-empty">Aucune tuile en cuisson — lance une recette ci-dessous.</div>`;
    } else {
      $('craft-card').innerHTML = state.crafts.map(c => {
        const r = R(c.tileId), pct = Math.min(100, (now-c.start)/(c.end-c.start)*100);
        const left = Math.max(0, Math.ceil((c.end-now)/1000));
        return `<div class="craft">
          <div class="swatch" style="background:${r.color}"></div>
          <div><div style="display:flex;justify-content:space-between"><span class="cname">${r.name}</span><span class="ctime">${left}s</span></div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>
        </div>`;
      }).join('');
    }

    // recipes
    $('recipe-card').innerHTML = knownRecipes().map(r => {
      const stock = state.inventory[r.id]||0;
      const canCraft = state.crafts.length < craftSlots() && state.clay >= r.clay;
      return `<div class="recipe">
        <div class="swatch" style="background:${r.color}"></div>
        <div><div class="name">${r.name} ${stock>0?`<span class="badge stock">${stock} en stock</span>`:''}</div>
          <div class="req">${r.clay} argile · ${r.time}s de cuisson</div></div>
        <button class="btn" data-action="craft" data-id="${r.id}" ${canCraft?'':'disabled'}>Modeler</button>
      </div>`;
    }).join('');

    // workers
    const wt = $('worker-title'), wc = $('worker-card');
    if(!workersOn()){ wt.hidden = true; wc.hidden = true; }
    else {
      wt.hidden = false; wc.hidden = false;
      wc.innerHTML = knownRecipes().map(r => {
        const n = state.workers[r.id]||0, cost = workerCost(r), afford = state.money >= cost;
        return `<div class="recipe">
          <div class="swatch" style="background:${r.color}"></div>
          <div><div class="name">Ouvrier · ${r.name} ${n>0?`<span class="badge stock">×${n}</span>`:''}</div>
            <div class="req">${n>0?`${n} tuile${n>1?'s':''}`:'1 tuile'} / ${r.time}s · ${r.clay} argile chacune</div></div>
          <button class="btn money" data-action="hire" data-id="${r.id}" ${afford?'':'disabled'}>${eur(cost)}</button>
        </div>`;
      }).join('');
    }
  }

  function renderOrders(){
    $('order-count').textContent = `${state.orders.length} / ${orderSlots()}`;
    const wrap = $('orders-wrap');
    if(state.orders.length === 0){ wrap.innerHTML = `<div class="empty">Pas de commande pour l'instant. De nouveaux clients arrivent bientôt…</div>`; return; }
    wrap.innerHTML = state.orders.map(o => {
      const r = R(o.tileId), stock = state.inventory[o.tileId]||0, ok = stock >= o.qty, miss = o.qty - stock;
      return `<div class="card order">
        <div class="top">
          <div><div class="client">${o.client}</div>
            <div class="want"><span class="mini-swatch" style="background:${r.color}"></span>${o.qty} × ${r.name}</div></div>
          <div class="reward">${eur(o.reward)}</div>
        </div>
        <div class="actions">
          <span class="${ok?'':'miss'}">${ok?`En stock : ${stock}`:`Il te manque ${miss} tuile${miss>1?'s':''}`}</span>
          <button class="btn money" data-action="deliver" data-id="${o.id}" ${ok?'':'disabled'}>Livrer</button>
        </div>
      </div>`;
    }).join('');
  }

  function renderMethods(){
    $('methods-wrap').innerHTML = METHODS.map(m => {
      const learned = has(m.id), afford = state.money >= m.cost;
      return `<div class="card method ${learned?'learned':''}">
        <div><div class="name">${m.name}<span class="tag ${m.kind}">${m.kind==='recipe'?'Recette':'Amélioration'}</span></div>
          <div class="desc">${m.desc}</div></div>
        ${learned ? `<div class="done">Appris ✓</div>`
                  : `<button class="btn" data-action="learn" data-id="${m.id}" ${afford?'':'disabled'}>${eur(m.cost)}</button>`}
      </div>`;
    }).join('');
  }

  function renderAll(){
    // Ne pas reconstruire le DOM pendant qu'un doigt est posé : sinon le bouton
    // touché est remplacé entre le pointerdown et le click, et le tap est perdu.
    if(pointerDown || tapLock){ renderPending = true; return; }
    renderTop();
    if(activeTab==='atelier') renderAtelier();
    else if(activeTab==='commandes') renderOrders();
    else renderMethods();
    // order notification dot
    const anyReady = state.orders.some(o => (state.inventory[o.tileId]||0) >= o.qty);
    document.querySelector('.tab[data-tab="commandes"]').classList.toggle('has-orders', anyReady);
  }

  // ---------- event delegation ----------
  $('root').addEventListener('click', e => {
    const el = e.target.closest('[data-action]'); if(!el) return;
    const a = el.dataset.action;
    if(a==='tab'){ switchTab(el.dataset.tab); }
    else if(a==='buy-clay'){ buyClay(); }
    else if(a==='craft'){ startCraft(el.dataset.id); }
    else if(a==='deliver'){ deliver(parseInt(el.dataset.id,10)); }
    else if(a==='learn'){ learn(el.dataset.id); }
    else if(a==='hire'){ hireWorker(el.dataset.id); }
    else if(a==='theme'){
      const cur = document.documentElement.getAttribute('data-theme');
      const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark?'light':'dark');
    }
  });
  function switchTab(t){
    activeTab = t;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab===t));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+t));
    renderAll();
  }

  // ---------- main loop ----------
  let lastTick = Date.now();
  function tick(){
    const now = Date.now();
    let changed = false;
    const dtMs = Math.min(now - lastTick, 8*3600*1000); lastTick = now;
    if(runWorkers(dtMs)) changed = true;
    // finish crafts
    for(let i=state.crafts.length-1;i>=0;i--){
      if(now >= state.crafts[i].end){
        const c = state.crafts.splice(i,1)[0];
        state.inventory[c.tileId] = (state.inventory[c.tileId]||0) + (c.yield||1);
        changed = true;
      }
    }
    // generate orders
    if(state.orders.length < orderSlots() && now >= state.nextOrderAt){
      state.orders.push(makeOrder());
      state.nextOrderAt = now + 14000;
      changed = true;
    } else if(state.orders.length >= orderSlots()){
      state.nextOrderAt = now + 14000;
    }
    if(changed) save();
    renderAll();
    requestAnimationFrame(() => setTimeout(tick, 120));
  }

  let toastTimer;
  function toast(html){ const t=$('toast'); t.innerHTML=html; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3600); }

  document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
  window.addEventListener('pagehide', save);

  // ---------- boot ----------
  if(!load()){ seedOrders(); }
  catchUp();
  if(state.orders.length === 0) seedOrders();
  if(!state.nextOrderAt) state.nextOrderAt = Date.now()+14000;
  renderAll();
  lastTick = Date.now();
  tick();
})();
</script>
</body>
</html>
